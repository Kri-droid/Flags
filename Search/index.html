<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Flags - Search</title>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="Page with every flag in the world">
		<meta property="og:title" content="Flags - Home Page">
		<meta property="og:description" content="Page with every flag in the world">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://kri-droid.github.io/Flags/Search/">
		<meta property="og:image" content="../ImgToHTML/ogimage.png">
		<link rel="canonical" href="https://kri-droid.github.io/Flags/Search/">
		<link rel="icon" href="../ImgToHTML/favicon.png">
		<link rel="icon" type="image/png" sizes="16x16" href="../ImgToHTML/favicon16x16.png">
		<link rel="icon" type="image/png" sizes="32x32" href="../ImgToHTML/favicon32x32.png">
		<link rel="apple-touch-icon" href="../ImgToHTML/apple-touch-icon.png">
		
		<link rel="stylesheet" href="../upmenu.css">
		<link rel="stylesheet" href="page.css">
		<link rel="stylesheet" href="result.css">
		<link rel="stylesheet" href="media.css">
	</head>
	<body>
		<div id="upmenu">
			<img id="settingsBtn" src="../ImgToHTML/settings.svg">
			<a id="homelink" href="https://kri-droid.github.io/Flags">
				<img src="../ImgToHTML/Favicon.svg">
			</a>
			<img id="changelogbtn" src="../ImgToHTML/changelog.svg">
		</div>
		<div id="showlang">
			<h1 id="langtext" style="display: flex; justify-content: center; align-items: center;">Language:</h1>
			<img src="../ImgToHTML/Wielka Brytania.svg" class="langimg" onclick="setLanguage('en')" alt="English">
			<img src="../ImgToHTML/Polska.svg" class="langimg" onclick="setLanguage('pl')" alt="Polish">
		</div>
		<div id="changelog">
			<h1 id="changelogtext">Changelog</h1>
			<a id="changecontent"></a>
		</div>
		<div id="Search">
			<div id="SearchBord">
				<!--Państwo-->
				<a class="textlanf">Country:</a>
				<input id="SearchCountry">
				<div class="heivpx"></div>
				<!--Rok-->
				<a class="textlanf">Years:</a>
				<input id="SearchFrom" class="numb" oninput="numonly(this, true, false);">
				<a>-</a>
				<input id="SearchTo" class="numb" oninput="numonly(this, true, false);">
				<!--Ukryty-->
				<div id="SearchHid">
					<div class="heivpx"></div>
					<!--Proporcje-->
					<a class="textlanf">Aspect ratio:</a>
					<input id="SearchPropHei" class="numb" oninput="numonly(this, false, true);" placeholder="Height:">
					<a>:</a>
					<input id="SearchPropWid" class="numb" oninput="numonly(this, false, true);" placeholder="Width:">
					<div class="heivpx"></div>
					<!--Wariant-->
					<a class="textlanf">Variant:</a>
					<select id="SearchVariantSel">
						<option class="textlanf" value="P">Most popular</option>
						<option class="textlanf" value="O">All official</option>
						<option class="textlanf" value="N">Unstandarized</option>
					</select>
				</div>
			</div>
			<button id="visblit" onclick="bisible('visblit', 'SearchHid', 0)">▼</button>
			<button id="SearchBtn" onclick="search()">Search</button>
		</div>
		<br>
		<hr style="color: white;">
		<div id="Results"></div>
		<div id="InfoDiv">
			<div id="InfoDivPages">
				<div id="Info" class="infopage">INFO</div>
				<div id="Constr" class="infopage">CONSTRUCTION</div>
				<div id="Colors" class="infopage">COLORS</div>
				<div id="Frag" class="infopage">FRAGMENTS</div>
			</div>
			<div id="InfoCont">
				<div id="InfoLeft">
					<img id="InfoFlag">
					<p id="InfoProp"></p>
				</div>
				<div id="InfoData">
					<p id="nameInfo" class="name"></p>
					<p id="OffNameInfo" class="officialname"></p>
					<p id="InfoYears" class="years"></p>
				</div>
				<p id="InfoText"></p>
			</div>
			<div id="ConstrCont">
				<div id="ConstrDiv">
					<img id="ConstrFlag">
				</div>
			</div>
			<div id="ColorsCont"></div>
			<div id="FragCont"><p>Nothing Yet</p></div>
		</div>
		<script src="data.js"></script>
		<script src="index.js" defer></script>
	</body>
</html>
